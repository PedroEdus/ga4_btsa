name: ETL — GA4 Buriti

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC = 04:00 BRT (dados do dia anterior já consolidados)
  workflow_dispatch:

jobs:
  etl:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Restaurar credenciais GCP (BigQuery)
        run: |
          mkdir -p keys
          echo "${{ secrets.GCP_SA_KEY }}" | tr -d '\n\r' | base64 -d > keys/ga4-buriti-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=keys/ga4-buriti-sa.json" >> $GITHUB_ENV

      - name: Restaurar token OAuth GA4
        run: |
          echo "${{ secrets.GA4_TOKEN_PKL }}" | tr -d '\n\r' | base64 -d > token.pkl
          echo "GA4_TOKEN_PATH=token.pkl" >> $GITHUB_ENV

      - name: Rodar ETL
        run: python etl/load_ga4_buriti.py
