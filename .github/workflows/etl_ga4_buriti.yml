name: ETL — GA4 Buriti

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC = 04:00 BRT (dados do dia anterior já consolidados)
  workflow_dispatch:

jobs:
  etl:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Restaurar credenciais GCP (BigQuery)
        env:
          SECRET_B64: ${{ secrets.GCP_SA_KEY }}
        run: |
          mkdir -p keys
          python3 -c "import base64,os; s=''.join(os.environ['SECRET_B64'].split()); open('keys/ga4-buriti-sa.json','wb').write(base64.b64decode(s+'='*(-len(s)%4)))"
          echo "GOOGLE_APPLICATION_CREDENTIALS=keys/ga4-buriti-sa.json" >> $GITHUB_ENV

      - name: Restaurar token OAuth GA4
        env:
          SECRET_B64: ${{ secrets.GA4_TOKEN_PKL }}
        run: |
          python3 -c "import base64,os; s=''.join(os.environ['SECRET_B64'].split()); open('token.pkl','wb').write(base64.b64decode(s+'='*(-len(s)%4)))"
          echo "GA4_TOKEN_PATH=token.pkl" >> $GITHUB_ENV

      - name: Rodar ETL
        run: python etl/load_ga4_buriti.py
